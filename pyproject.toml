[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "dspy-service"
version = "0.1.0"
description = "DSPy service for Graffiticode prompt specification compilation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Graffiticode", email = "support@graffiticode.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
dspy = [
    "dspy-ai>=2.4.0",
]

[project.scripts]
dspy-service = "src.main:main"

[tool.pdm.scripts]
dev = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8080"
start = "uvicorn src.main:app --host 0.0.0.0 --port 8080"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"
deploy = "gcloud builds submit --project=graffiticode-app"
deploy-tag = {cmd = "gcloud builds submit --project=graffiticode-app --substitutions=_TAG={args}"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
